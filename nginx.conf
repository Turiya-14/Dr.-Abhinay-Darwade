server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Prerendered pages: /  and  /privacy-policy/  (real 404 for anything else)
    location / {
        try_files $uri $uri/ =404;
    }

    # Hashed build output, safe to cache for a year
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(woff2?|webp|jpe?g|png|svg|ico)$ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }
}
